[theme]
base = "dark"
primaryColor = "#6FD6C5"
backgroundColor = "#10151D"
secondaryBackgroundColor = "#1B2430"
textColor = "#E9EEF3"
font = "sans serif"

[server]
# Let the hosting platform choose its bind address. AWS systemd explicitly uses localhost.
maxUploadSize = 12
headless = true

[browser]
gatherUsageStats = false
